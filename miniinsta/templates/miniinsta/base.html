{% load static %}
<html>
    <head>
        <title>Mini Insta</title>
        <link rel="stylesheet" type="text/css" href="{% static 'miniinsta.css' %}">
    </head>
    <body>
        <h1>Mini Insta</h1>
        <div id="content-container">
            {% block content %}
            {% endblock %}
        </div>
    </body>
    <footer>
    <!-- Redirects user to all profiles -->
        {% if profile %}
        <p><a href="{% url 'create_post' profile.pk %}">Create Post</a></p>
        {% endif %}
        <p><a href="{% url 'show_all_profiles' %}">View All Profiles</a></p>
        <p>Developed by Arhan Sheth.</p>
    </footer>
</html>
